name: Windows build and tests

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_mingw
          modules: qtquick3d qtmultimedia qtshadertools
          tools: tools_mingw1310
      - name: Configure
        shell: pwsh
        run: >
          cmake -S native -B native/build-worktree-mingw -G "MinGW Makefiles"
          -DCMAKE_BUILD_TYPE=Release -DMARCHCRAFT_SYNC_PRODUCTION_PREVIEW=OFF
      - name: Build
        run: cmake --build native/build-worktree-mingw --parallel 2
      - name: Test
        run: ctest --test-dir native/build-worktree-mingw --output-on-failure
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-diagnostics
          path: |
            native/build-worktree-mingw/Testing
            native/build-worktree-mingw/marchcraft-startup.log

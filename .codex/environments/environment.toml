# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "MarchCraft"

[setup]
script = '''
$ErrorActionPreference = "Stop"

$originalProject = $env:CODEX_SOURCE_TREE_PATH
$worktree = $env:CODEX_WORKTREE_PATH

if (-not $originalProject) {
    throw "CODEX_SOURCE_TREE_PATH was not provided."
}

if (-not $worktree) {
    throw "CODEX_WORKTREE_PATH was not provided."
}

$sdk = Join-Path $originalProject "native"
$source = Join-Path $worktree "native"

$compilerBin = Join-Path $sdk ".qt\Tools\mingw1310_64\bin"
$qtRoot = Join-Path $sdk ".qt\6.8.3\mingw_64"
$qtBin = Join-Path $qtRoot "bin"

$cxxCompiler = Join-Path $compilerBin "g++.exe"
$qmake = Join-Path $qtBin "qmake.exe"
$cmakeLists = Join-Path $source "CMakeLists.txt"

$requiredFiles = @(
    $cxxCompiler,
    $qmake,
    $cmakeLists
)

foreach ($requiredFile in $requiredFiles) {
    if (-not (Test-Path -LiteralPath $requiredFile)) {
        throw "Required file was not found or is inaccessible: $requiredFile"
    }
}

Write-Host "MarchCraft worktree environment is ready."
Write-Host "Original checkout: $originalProject"
Write-Host "Worktree: $worktree"
Write-Host "Compiler: $cxxCompiler"
Write-Host "Qt: $qtRoot"'''

[[actions]]
name = "Test MarchCraft"
icon = "test"
command = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File \"$PWD\\native\\scripts\\test.ps1\""

[[actions]]
name = "Create 3d Preview"
icon = "tool"
command = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File \"$PWD\\native\\scripts\\create-3d-preview.ps1\""

[[actions]]
name = "Build and Run MarchCraft"
icon = "run"
command = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File \"$PWD\\native\\scripts\\build-and-run.ps1\""
